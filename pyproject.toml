[project]
name = "promptbait"
version = "0.1.0"
description = "Tool-calling LLM agent, red-teamed with a 24-case prompt-injection suite"
requires-python = ">=3.12"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "live: hits real model providers; needs PROMPTBAIT_LIVE=1 and Ollama access",
]
addopts = "-ra"
